name: Deploy Web-MediaList App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on server
        run: |
          cd /srv/apps/Web-MediaList
          git pull origin main --hard

          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"

          export $(grep -v '^#' .env.local | xargs)

          rm -rf .next

          npm ci
          npm run build

          pm2 restart Website-CoffeeCoders
